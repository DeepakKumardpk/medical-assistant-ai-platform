<svg width="900" height="500" viewBox="0 0 900 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deskbg" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#deskbg)"/>

  <!-- window light -->
  <rect x="0" y="0" width="900" height="260" fill="#f8fafc" opacity="0.5"/>
  <g stroke="#cbd5e1" stroke-width="2" opacity="0.6">
    <line x1="450" y1="0" x2="450" y2="260"/>
    <line x1="0" y1="130" x2="900" y2="130"/>
  </g>

  <!-- desk surface -->
  <rect x="0" y="330" width="900" height="170" fill="#93c5fd"/>
  <rect x="0" y="330" width="900" height="14" fill="#60a5fa"/>

  <!-- laptop -->
  <g transform="translate(430,260)">
    <path d="M-140 90 L-120 30 H120 L140 90 Z" fill="#1e3a8a"/>
    <rect x="-118" y="-70" width="236" height="100" rx="6" fill="#0f172a"/>
    <rect x="-106" y="-58" width="212" height="76" rx="3" fill="#2563eb"/>
    <rect x="-90" y="-40" width="90" height="8" rx="4" fill="#93c5fd" opacity="0.8"/>
    <rect x="-90" y="-24" width="140" height="8" rx="4" fill="#93c5fd" opacity="0.6"/>
    <rect x="-90" y="-8" width="70" height="8" rx="4" fill="#93c5fd" opacity="0.6"/>
    <circle cx="60" cy="10" r="20" fill="#ffffff" opacity="0.15"/>
    <path d="M52 10 l6 6 l12 -14" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- stethoscope -->
  <g transform="translate(180,400)" stroke="#1e293b" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M0 -60 C0 -20 -40 -10 -40 20 C-40 45 -20 60 10 60 C40 60 60 45 60 20 C60 -5 40 -15 40 -40"/>
    <circle cx="0" cy="-66" r="9" fill="#1e293b" stroke="none"/>
    <circle cx="40" cy="-46" r="9" fill="#1e293b" stroke="none"/>
  </g>
  <circle cx="10" cy="470" r="22" fill="#334155"/>
  <circle cx="10" cy="470" r="13" fill="#475569"/>

  <!-- notepad + pen -->
  <g transform="translate(680,410)">
    <rect x="-50" y="-30" width="100" height="70" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-36" y1="-10" x2="36" y2="-10" stroke="#93c5fd" stroke-width="3"/>
    <line x1="-36" y1="2" x2="36" y2="2" stroke="#93c5fd" stroke-width="3"/>
    <line x1="-36" y1="14" x2="10" y2="14" stroke="#93c5fd" stroke-width="3"/>
    <rect x="30" y="-20" width="6" height="55" rx="3" fill="#2563eb" transform="rotate(20 30 -20)"/>
  </g>

  <!-- plant -->
  <g transform="translate(800,430)">
    <path d="M-16 30 L16 30 L10 -10 L-10 -10 Z" fill="#60a5fa"/>
    <path d="M0 -10 C-24 -10 -30 -40 -10 -50 C-6 -34 0 -24 0 -10 Z" fill="#22c55e"/>
    <path d="M0 -10 C24 -10 30 -44 8 -56 C4 -36 0 -24 0 -10 Z" fill="#16a34a"/>
    <path d="M0 -10 C-4 -30 -2 -46 4 -60 C12 -44 10 -26 6 -10 Z" fill="#4ade80"/>
  </g>
</svg>
