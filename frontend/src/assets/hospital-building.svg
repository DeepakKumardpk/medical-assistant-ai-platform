  </g>

  <!-- ground -->
  <rect x="0" y="430" width="900" height="70" fill="#dbeafe"/>

  <!-- side wing (left) -->
  <rect x="40" y="300" width="180" height="150" fill="#bfdbfe"/>
  <g fill="url(#glass)" opacity="0.9">
    <rect x="55" y="315" width="30" height="30" rx="3"/>
